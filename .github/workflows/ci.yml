name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-useless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    # For the integration tests (tests/integration). Same image as docker-compose.yml; the
    # password is a throwaway for this temporary container, not a secret.
    services:
      neo4j:
        image: neo4j:2026.10.1-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Python comes from apps/api/.python-version.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest
