# Agent evals (docs/evals.md): run the golden set through the real agent, by hand only.
#
# Needs the protected `evals` environment with the secrets GROQ_API_KEY and GEMINI_API_KEY.
# One full run uses about 85,000 Groq tokens of the free 200,000 a day, so it is never
# scheduled; the run stops before any LLM call if the chosen cases don't fit. No databases:
# the golden set (apps/api/evals/golden_set.json) holds every fact. Nothing is committed: the
# report is in the job summary and the full results are a workflow artifact.
name: Agent evals

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case IDs, comma-separated (empty = all)"
        required: false
        default: ""
      fallback_case:
        description: "Run the real Gemini fallback case"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: evals
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false # a job with secrets loads nothing another run could have planted
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Run the evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Inputs go through the environment, never into the script text.
          CASES: ${{ inputs.cases }}
          FALLBACK_CASE: ${{ inputs.fallback_case }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          if [ "$FALLBACK_CASE" != "true" ]; then args+=(--no-fallback-case); fi
          # --no-sync: keep the environment from the step above (no dev tools in a job with keys).
          uv run --no-sync python -m depguard.evals.run "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: apps/api/evals-results/
          if-no-files-found: ignore
          retention-days: 30
