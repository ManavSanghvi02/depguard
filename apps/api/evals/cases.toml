# The eval cases (docs/evals.md). Each names one real finding; scripts/build_golden_set.py looks it
# up in the lockfile with the scan's own code and writes evals/golden_set.json.
#
#   id         unique name of the case
#   lockfile   path from apps/api; the source repos are listed in tests/fixtures/README.md
#   package, version, advisory   the finding (advisory = DepGuard's main ID for the group)
#   key        only when the same package version is installed at several paths
#   injection  attack text put in front of the advisory details (prompt-injection cases)
#   injection_markers  injected text that must not appear in the explanation
#   force_fallback     Groq is made to fail, so the real Gemini fallback runs

# Lockfiles too big to commit (the pre-commit limit is 500 KB). build_golden_set.py downloads each one
# at its fixed commit when it is missing, and checks its SHA-256. The files are gitignored.
[downloads."evals/lockfiles/nodejs-goof/package-lock.json"]
url = "https://raw.githubusercontent.com/snyk-labs/nodejs-goof/add14ba59e98240d9e00a235dd7d42cd61ae9912/package-lock.json"
sha256 = "b94e05f7e0ede5f9dd0a172e6a41f8b0f96324719516ee8d74fe7dc8b186475a"

