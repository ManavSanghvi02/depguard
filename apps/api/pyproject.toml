[project]
name = "depguard"
version = "0.1.0"
description = "Finds and ranks vulnerable npm and PyPI dependencies in GitHub repos."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cvss>=3.6",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "neo4j>=6.4.1",
    "packaging>=26.3",
    "poetry-core>=2.5.0",
    "pydantic-settings>=2.16.1",
    "semver>=3.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, S: security checks
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
# The apps/api/alembic folder holds migrations; the import is the alembic library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results; tests use fake tokens such as "test"
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["cvss", "asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test helpers (fake_osv.py) live in tests/; scripts/ holds the comparison script.
pythonpath = ["tests", "scripts"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
