# Local Postgres + Neo4j for development and tests. Values come from .env.
# Postgres 17 matches Supabase; Neo4j calendar versions match AuraDB.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:2026.10.1-community
    environment:
      # Community edition's admin user is always "neo4j". Password: at least 8 characters.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  neo4j-data:
